server:
  port: 8080

spring:
  application:
    name: erp

  config:
    # El sufijo [.properties] es obligatorio: Spring Boot no reconoce la
    # extension ".env" y sin el no sabe que loader usar. Con "optional:" la
    # ignoraria en silencio y la app arrancaria igual, fallando despues con
    # ORA-01017 en la primera consulta.
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:oracle:thin:@localhost:1521/orclpdb}
#  url: ${DB_URL:jdbc:oracle:thin:@localhost:1521/XEPDB1} en caso de usar Oracle XE 21c    
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: oracle.jdbc.OracleDriver

  jackson:
    date-format: yyyy-MM-dd'T'HH:mm:ss
    time-zone: America/Guatemala

logging:
  level:
    root: INFO
    com.umg.seguridad: DEBUG
    org.springframework.jdbc.core: DEBUG


security:
  jwt:
    secret-key: CAMBIA_ESTO_POR_UNA_CLAVE_LARGA_Y_SEGURA_1234567890
    expiration-ms: 3600000   # 1 hora